name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Node Dependencies
        run: npm install

      - name: Generate version.json before Web Build
        run: |
          RUN_NUM="${{ github.run_number }}"
          VERSION_CODE=$((100 + RUN_NUM))
          VERSION_NAME="1.0.${RUN_NUM}"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p public
          cat << EOF > public/version.json
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "buildTime": "${BUILD_TIME}",
            "downloadUrl": "https://github.com/PrimiasArt/Chill-reader/releases/download/android-apk-latest/ChillReader-v1.0.apk",
            "commit": "${{ github.sha }}",
            "releaseNotes": "Bản cập nhật v${VERSION_NAME} tự động qua GitHub Actions"
          }
          EOF
          cp public/version.json version.json

      - name: Build Web App (Vite)
        run: npm run build

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK outputs
        run: |
          RUN_NUM="${{ github.run_number }}"
          APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK_SRC" ChillReader-v1.0.apk
          cp "$APK_SRC" "ChillReader-v1.0.${RUN_NUM}.apk"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChillReader-v1.0.${{ github.run_number }}-APK
          path: |
            ChillReader-v1.0.apk
            ChillReader-v1.0.${{ github.run_number }}.apk
            version.json
          retention-days: 30

      - name: Create GitHub Release for New Version
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Chill Reader APK v1.0.${{ github.run_number }} (Mới nhất)
          make_latest: true
          body: |
            ## 📱 Bản cài đặt Android APK (Chill Reader - v1.0.${{ github.run_number }})
            - **Phiên bản:** `1.0.${{ github.run_number }}` (Mới nhất)
            - **Chữ ký cố định (Persistent Keystore):** Cài đè trực tiếp mà không cần gỡ bản cũ, giữ nguyên 100% dữ liệu sách offline và cài đặt đồng bộ Supabase Cloud.
            - **Tính năng & Sửa lỗi:**
              - 🚀 **Khắc phục triệt để lỗi audio tự dừng giữa chừng khi nghe truyện:**
                - Khử bỏ nhận diện nhầm luồng âm thanh nền của app/game khác (chỉ ưu tiên cuộc gọi SIM/Zalo/Instagram/Messenger và chuông báo thức).
                - Tự động tiếp tục đọc khi cuộc gọi hoặc chuông báo thức kết thúc.
                - Bổ sung Watchdog tự động nhảy câu nếu Native TTS engine bị treo/rớt callback trên Android.
                - Tự động bỏ qua các câu ký tự đặc biệt/dấu câu rỗng không làm kẹt hàng đợi.
                - Ngăn WebView xóa cache và Garbage Collection khi đang phát audio ở chế độ nền.
                - Cập nhật lockscreen notification mượt mà không re-startForeground liên tục.

            👉 Tải file **`ChillReader-v1.0.apk`** hoặc **`ChillReader-v1.0.${{ github.run_number }}.apk`** bên dưới để cài đặt trực tiếp vào điện thoại Android.
          files: |
            ChillReader-v1.0.apk
            ChillReader-v1.0.${{ github.run_number }}.apk
            version.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest tag release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-apk-latest
          name: Chill Reader Android APK (Mới nhất)
          make_latest: false
          files: |
            ChillReader-v1.0.apk
            ChillReader-v1.0.${{ github.run_number }}.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
