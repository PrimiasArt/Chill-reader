name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Node Dependencies
        run: npm install

      - name: Parse and Prepare Version Info
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            let versionData = {};
            try {
              versionData = JSON.parse(fs.readFileSync('./public/version.json', 'utf8'));
            } catch (e) {}

            const versionName = versionData.versionName || pkg.version || '1.0.44';
            const versionCode = Number(versionData.versionCode) || 144;
            const releaseNotes = versionData.releaseNotes || ('Bản cập nhật v' + versionName);

            versionData.versionName = versionName;
            versionData.versionCode = versionCode;
            versionData.buildTime = new Date().toISOString();
            versionData.commit = process.env.GITHUB_SHA || '';
            versionData.downloadUrl = 'https://github.com/PrimiasArt/Chill-reader/releases/download/android-apk-latest/ChillReader-v1.0.apk';
            versionData.releaseNotes = releaseNotes;

            fs.writeFileSync('./public/version.json', JSON.stringify(versionData, null, 2));
            fs.writeFileSync('./version.json', JSON.stringify(versionData, null, 2));

            const envFile = process.env.GITHUB_ENV;
            if (envFile) {
              fs.appendFileSync(envFile, 'APP_VERSION_NAME=' + versionName + '\n');
              fs.appendFileSync(envFile, 'APP_VERSION_CODE=' + versionCode + '\n');
            }
          "

      - name: Build Web App (Vite)
        run: npm run build

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        env:
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK outputs
        run: |
          APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK_SRC" ChillReader-v1.0.apk
          cp "$APK_SRC" "ChillReader-v${{ env.APP_VERSION_NAME }}.apk"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChillReader-v${{ env.APP_VERSION_NAME }}-APK
          path: |
            ChillReader-v1.0.apk
            ChillReader-v${{ env.APP_VERSION_NAME }}.apk
            version.json
          retention-days: 30

      - name: Create GitHub Release for New Version
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: Chill Reader APK v${{ env.APP_VERSION_NAME }} (Mới nhất)
          make_latest: true
          body: |
            ## 📱 Bản cài đặt Android APK (Chill Reader - v${{ env.APP_VERSION_NAME }})
            - **Phiên bản:** `v${{ env.APP_VERSION_NAME }}` (Build ${{ env.APP_VERSION_CODE }})
            - **Chữ ký cố định (Persistent Keystore):** Cài đè trực tiếp mà không cần gỡ bản cũ, giữ nguyên 100% dữ liệu sách offline và cài đặt đồng bộ Supabase Cloud.
            
            ### ✨ Tính năng & Cải tiến mới:
            - 🏛️ **Kệ sách Gỗ Cổ Điển Boutique:** Trưng bày gáy sách 3D dập nổi chữ vàng, ruy băng đánh dấu trang, chuyển đổi linh hoạt giữa Dạng Lưới và Kệ Gỗ Sang Trọng.
            - 🤖 **Trợ lý AI Đồng Hành (Chống Spoil Tuyệt Đối):** Hỏi đáp bối cảnh, cảnh giới, quan hệ nhân vật độc quyền theo đúng tiến độ chương đang đọc mà không bao giờ lộ cốt truyện tương lai.
            - ⚡ **Công nghệ Đọc Bionic Reading:** Tăng tốc độ đọc x2 bằng phương pháp in đậm tiền tố từ vựng khoa học.
            - 🎧 **Trải nghiệm giác quan sống động:** Hiệu ứng âm thanh lật giấy vật lý chân thực khi chuyển trang; Không gian âm thanh Chuông xoay Tây Tạng (432Hz/528Hz) & Thư viện cổ kính.
            - 📖 **Trình đọc Comic & Manga (.CBZ, .CBR, .ZIP):** Hỗ trợ cuộn Webtoon dài và lật trang Cinema.
            - 📷 **Chụp ảnh trang sách chuyển chữ OCR:** Gemini Vision AI nhận diện chữ từ Camera 1 chạm.
            - 🔒 **Két lưu trữ ChillVault (.chillvault):** Xuất & Nhập toàn bộ kho sách, chương đọc, ghi chú và cài đặt hoàn toàn offline chỉ với 1 chạm.
            - 🕯️ **Thước đọc tập trung (Reading Ruler)**, Bộ lọc ánh sáng ấm bảo vệ mắt (1800K–2700K) và Vân giấy cổ điển.
            - 🎭 **Multi-Voice AI Drama:** Phân vai tự động theo hội thoại và giới tính nhân vật.
            - 📥 **Tải Audio offline theo lô:** 1, 3, 5, 10 chương bảo đảm 100% không cần mạng.

            👉 Tải file **`ChillReader-v1.0.apk`** hoặc **`ChillReader-v${{ env.APP_VERSION_NAME }}.apk`** bên dưới để cài đặt trực tiếp vào điện thoại Android.
          files: |
            ChillReader-v1.0.apk
            ChillReader-v${{ env.APP_VERSION_NAME }}.apk
            version.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest tag release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-apk-latest
          name: Chill Reader Android APK (Mới nhất)
          make_latest: false
          files: |
            ChillReader-v1.0.apk
            ChillReader-v${{ env.APP_VERSION_NAME }}.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
